name: Sync frontend

# Vendors every published release into the frontend and opens a PR
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-frontend:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      FRONTEND_OWNER: music-assistant
      FRONTEND_REPO: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Clients pin the tag, so it has to say the same thing as the manifest.
      - name: Check the tag matches manifest.json
        run: |
          VERSION="$(jq -r .version manifest.json)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Create frontend token
        id: frontend_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ env.FRONTEND_OWNER }}
          repositories: ${{ env.FRONTEND_REPO }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.FRONTEND_OWNER }}/${{ env.FRONTEND_REPO }}
          token: ${{ steps.frontend_token.outputs.token }}
          persist-credentials: false
          path: frontend

      # The frontend's package.json says which pnpm to use.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run the frontend sync
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm sync:shared-icons "$TAG"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          path: frontend
          token: ${{ steps.frontend_token.outputs.token }}
          commit-message: "⬆️ Sync shared-icons to ${{ github.event.release.tag_name }}"
          sign-commits: true
          branch: "auto-update-shared-icons-${{ github.event.release.tag_name }}"
          base: main
          delete-branch: true
          title: "⬆️ Sync shared-icons to ${{ github.event.release.tag_name }}"
          labels: |
            dependencies
          body: |
            Sync vendored icons to shared-icons [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}).

            ${{ github.event.release.body }}

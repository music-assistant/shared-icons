name: Sync mobile

# Mobile hand-converts every SVG into a vector asset, so a release that adds or
# redraws icons needs a human on that side. File an issue listing exactly what
# changed. Nothing to do when a release only touches keywords or metadata.
on:
  release:
    types: [published]
  # Escape hatch: the release is already published by the time this runs, so a
  # failed or missed notification can only be replayed by tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to report on (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-sync
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      MOBILE_OWNER: music-assistant
      MOBILE_REPO: mobile-app
    steps:
      # Full history: the icon list is a diff against the previous tag.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the icons this release changes
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          # The greatest tag strictly below this one — not simply the newest
          # tag, so a late patch on an older line still compares against its
          # own predecessor.
          PREV="$(git tag --sort=v:refname |
            awk -v cur="$TAG" '$0 == cur { exit } { prev = $0 } END { print prev }')"

          if [ -z "$PREV" ]; then
            echo "::notice::No tag older than $TAG — nothing to diff against."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git show "$PREV:manifest.json" > prev-manifest.json 2>/dev/null; then
            echo "::notice::$PREV predates manifest.json — nothing to diff against."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # manifest.json is the contract; ids map 1:1 to icons/<id>.svg.
          ADDED="$(jq -r -n \
            --slurpfile old prev-manifest.json \
            --slurpfile new manifest.json \
            '$new[0].icons - $old[0].icons | .[]')"

          # Redrawn artwork needs re-exporting over the existing asset, so it is
          # work for mobile too. --diff-filter=M keeps this to ids that existed
          # before: additions are 'A' and land in $ADDED, removals are 'D'.
          UPDATED="$(git diff --name-only --diff-filter=M "$PREV" "$TAG" -- icons/ |
            sed 's|^icons/||; s|\.svg$||')"

          if [ -z "$ADDED" ] && [ -z "$UPDATED" ]; then
            echo "::notice::$TAG changes no icons over $PREV — no issue needed."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count_of() { if [ -z "$1" ]; then echo 0; else printf '%s\n' "$1" | wc -l | tr -d ' '; fi; }
          N_ADDED="$(count_of "$ADDED")"
          N_UPDATED="$(count_of "$UPDATED")"

          # "1 new, 6 updated" — each half only when it has something to say.
          SUMMARY=""
          if [ "$N_ADDED" != "0" ]; then SUMMARY="$N_ADDED new"; fi
          if [ "$N_UPDATED" != "0" ]; then
            if [ -n "$SUMMARY" ]; then SUMMARY="$SUMMARY, "; fi
            SUMMARY="$SUMMARY$N_UPDATED updated"
          fi

          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          list_icons() {
            printf '%s\n' "$1" | while IFS= read -r id; do
              printf -- '- `%s` — [icons/%s.svg](%s/blob/%s/icons/%s.svg)\n' \
                "$id" "$id" "$REPO_URL" "$TAG" "$id"
            done
          }

          {
            printf '`%s` brings **%s** icon(s) in the shared set.\n\n' "$TAG" "$SUMMARY"
            printf 'Ids map 1:1 to the file names.\n\n'
            if [ "$N_ADDED" != "0" ]; then
              printf '### New icons\n\n'
              printf 'Convert each to a vector asset and wire it into the id → asset map.\n\n'
              list_icons "$ADDED"
              printf '\n'
            fi
            if [ "$N_UPDATED" != "0" ]; then
              printf '### Updated icons\n\n'
              printf 'Artwork changed upstream — re-export each over the existing asset. No id or mapping changes.\n\n'
              list_icons "$UPDATED"
              printf '\n'
            fi
            printf '### Links\n\n'
            printf -- '- Release: %s\n' "${RELEASE_URL:-$REPO_URL/releases/tag/$TAG}"
            printf -- '- Everything that changed since `%s`: %s/compare/%s...%s\n' \
              "$PREV" "$REPO_URL" "$PREV" "$TAG"
            printf -- '- Manifest at this tag: %s/blob/%s/manifest.json\n' "$REPO_URL" "$TAG"
          } > issue-body.md

          # Best effort — the compare link above already covers it if this fails.
          PRS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$TAG" \
            --jq '.commits[].sha' 2>/dev/null |
            while read -r sha; do
              gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[].number' 2>/dev/null || true
            done | sort -un || true)"

          if [ -n "$PRS" ]; then
            # Cross-repo refs: a bare #12 would point at the mobile-app repo.
            printf -- '- PRs: %s\n' "$(echo "$PRS" |
              awk -v repo="$GITHUB_REPOSITORY" '{ printf "%s%s#%s", sep, repo, $0; sep = ", " }')" \
              >> issue-body.md
          fi

          printf '\n---\n\nOpened automatically from the `%s` release in %s.\n' \
            "$TAG" "$GITHUB_REPOSITORY" >> issue-body.md

          echo "count=$((N_ADDED + N_UPDATED))" >> "$GITHUB_OUTPUT"
          echo "title=Shared icons $TAG — $SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Create app token
        if: steps.collect.outputs.count != '0'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ env.MOBILE_OWNER }}
          repositories: ${{ env.MOBILE_REPO }}
          permission-issues: write

      - name: File the issue
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TITLE: ${{ steps.collect.outputs.title }}
        run: |
          set -euo pipefail

          TARGET="$MOBILE_OWNER/$MOBILE_REPO"

          # Re-running the workflow for a tag shouldn't file the issue twice.
          # Match the title exactly — a fuzzy search hit must not suppress a
          # real notification, which would silently cost mobile the work.
          FOUND="$(gh issue list --repo "$TARGET" --state all --limit 100 \
            --search "in:title \"$TITLE\"" --json title |
            jq --arg t "$TITLE" '[.[] | select(.title == $t)] | length')"
          if [ "$FOUND" != "0" ]; then
            echo "::notice::\"$TITLE\" already exists in $TARGET — nothing to do."
            exit 0
          fi

          gh issue create --repo "$TARGET" \
            --title "$TITLE" \
            --body-file issue-body.md \
            --label automated \
            --label enhancement
